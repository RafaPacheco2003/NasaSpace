<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPHEREx · Búsqueda RA/DEC</title>
<style>body{background:#0b111a;color:#e4edf3;font:17px system-ui;max-width:1050px;margin:3rem auto;padding:1rem}section{background:#15202c;padding:1.5rem;border-radius:12px;margin:1rem 0}form{display:flex;gap:1rem;flex-wrap:wrap;align-items:end}label{display:grid;gap:.5rem}input,button{font:inherit;padding:.7rem;border-radius:6px;border:1px solid #62798e}button{background:#72e1cd;cursor:pointer}a{color:#72e1cd}img{max-width:100%;height:auto}#status{white-space:pre-wrap}small{color:#acbdcd}li{margin:.7rem 0}</style>
<h1>SPHEREx · Coordenadas ICRS</h1><p>Consulta observaciones L2 y el cubo all-sky que contiene la posición.</p>
<section><form id="search"><label>RA (grados)<input name="ra" type="number" step="any" min="0" max="359.999999999" required value="210.80227"></label><label>DEC (grados)<input name="dec" type="number" step="any" min="-90" max="90" required value="54.34895"></label><button id="submit">Buscar y procesar</button></form><p id="status" role="status" aria-live="polite">Listo. Los FITS pueden tardar varios minutos en descargarse.</p></section><div id="results"></div>
<script>
const status=document.querySelector('#status'),results=document.querySelector('#results'),button=document.querySelector('#submit');
function link(parent,base,file,label){const li=document.createElement('li'),a=document.createElement('a');a.href=base+file;a.textContent=label;a.target='_blank';a.rel='noopener';li.append(a);parent.append(li);}
function show(d){results.replaceChildren();for(const key of ['l2','allsky']){const value=d.result[key],section=document.createElement('section'),h=document.createElement('h2');h.textContent=key==='l2'?'Observación L2':'All-sky · 102 canales';section.append(h);if(value.error){const p=document.createElement('p');p.textContent=value.error;section.append(p);}else{const p=document.createElement('p');p.textContent=key==='l2'?`${value.count} observaciones encontradas · RGB con pseudocolor cividis`:`Cubo ${value.shape.join(' × ')} · Píxel ${value.pixel.join(', ')} · ${value.unit}`;section.append(p);const ul=document.createElement('ul');const files=key==='l2'?[['observations.json','URLs y metadatos de observaciones'],['l2.fits','Imagen L2 FITS'],['l2_normalized.npy','Imagen normalizada [0,1]'],['l2_gray.png','Vista en gris'],['l2_rgb.png','Vista RGB (pseudocolor)']]:[['cube_candidates.json','URLs de teselas candidatas'],['allsky_cube.fits','Cubo FITS original y metadatos'],['samples.npy','Matrices de seis canales'],['samples.ecsv','Seis muestras y metadatos espectrales'],['spectrum.ecsv','Espectro de 102 canales en la coordenada'],['preview3d.npz','Malla 3D con los 102 canales']];files.forEach(([f,l])=>link(ul,d.base,f,l));section.append(ul);for(const file of key==='l2'?['l2_gray.png','l2_rgb.png']:['samples.png','cube3d.png']){const img=document.createElement('img');img.src=d.base+file;img.alt=file==='cube3d.png'?'Cubo espectral: eje Z longitud de onda, no distancia física':file;img.loading='lazy';section.append(img);}}results.append(section);}const small=document.createElement('p');small.textContent='Las muestras corresponden a los canales 1, 20, 40, 60, 80 y 102. El cubo FITS conserva los datos; la imagen 3D reduce solo la malla espacial a un máximo de 32 × 32.';results.append(small);}
document.querySelector('#search').onsubmit=async e=>{e.preventDefault();button.disabled=true;results.replaceChildren();status.textContent='Consultando IRSA y procesando FITS…';try{const form=new FormData(e.target);let response=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ra:Number(form.get('ra')),dec:Number(form.get('dec'))})});let d=await response.json();if(!response.ok)throw Error(d.error);const id=d.id;while(true){await new Promise(r=>setTimeout(r,2000));response=await fetch('/api/jobs/'+id);d=await response.json();if(!response.ok)throw Error(d.error);if(d.status==='failed')throw Error(d.error);if(['complete','partial'].includes(d.status)){show(d);status.textContent=d.status==='complete'?'Procesamiento completado.':'Procesamiento parcial: revisa el error del producto correspondiente.';break;}}}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};
</script></html>
