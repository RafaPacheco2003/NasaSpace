components:
  schemas:
    AsteroidClick:
      properties:
        mjd_utc:
          type: number
          title: Mjd Utc
        time:
          type: string
          title: Time
        ra:
          type: number
          title: Ra
          description: Posición marcada por el usuario
        dec:
          type: number
          title: Dec
        ephemeris_ra:
          type: number
          title: Ephemeris Ra
          description: Posición de JPL Horizons en esa fecha
        ephemeris_dec:
          type: number
          title: Ephemeris Dec
        offset_arcsec:
          type: number
          title: Offset Arcsec
          description: Distancia entre el clic y Horizons (≤ 60″ o 422)
        pixel:
          anyOf:
          - $ref: '#/components/schemas/PixelResult'
          - type: 'null'
      type: object
      required:
      - mjd_utc
      - time
      - ra
      - dec
      - ephemeris_ra
      - ephemeris_dec
      - offset_arcsec
      title: AsteroidClick
    Center:
      properties:
        ra:
          type: number
          title: Ra
          description: Ascensión recta (grados, ICRS)
        dec:
          type: number
          title: Dec
          description: Declinación (grados, ICRS)
      type: object
      required:
      - ra
      - dec
      title: Center
    CoverageResult:
      properties:
        center:
          $ref: '#/components/schemas/Center'
        first_date:
          anyOf:
          - type: string
          - type: 'null'
          title: First Date
        last_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Date
        weeks:
          items:
            $ref: '#/components/schemas/CoverageWeek'
          type: array
          title: Weeks
        total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Total
        cache:
          anyOf:
          - type: string
          - type: 'null'
          title: Cache
      type: object
      required:
      - center
      - first_date
      - last_date
      - weeks
      title: CoverageResult
      description: 'Exposiciones por semana. Fuente externa: IRSA SIA v2.'
      example:
        cache: hit
        center:
          dec: -7.241944
          ra: 133.757778
        first_date: '2025-05-05'
        last_date: '2026-05-14'
        total: 258
        weeks:
        - count: 30
          week_start: '2025-05-05'
        - count: 24
          week_start: '2025-10-27'
    CoverageWeek:
      properties:
        week_start:
          type: string
          title: Week Start
          description: Lunes de la semana (YYYY-MM-DD)
        count:
          type: integer
          title: Count
      type: object
      required:
      - week_start
      - count
      title: CoverageWeek
    CurrentForecastRequest:
      properties:
        asteroid_id:
          type: integer
          exclusiveMinimum: 0.0
          title: Asteroid Id
          description: Número MPC del asteroide (433 = Eros). Se usa en JPL Horizons
        current_observation:
          $ref: '#/components/schemas/MjdObservation'
          description: 'T3: la posición marcada ahora (clic sobre el frame) y su fecha'
        horizon_days:
          type: number
          maximum: 30.0
          exclusiveMinimum: 0.0
          title: Horizon Days
          description: Días hacia adelante desde T3 (0 < h ≤ 30)
        image_id:
          anyOf:
          - type: string
            maxLength: 80
          - type: 'null'
          title: Image Id
        view:
          anyOf:
          - $ref: '#/components/schemas/View'
          - type: 'null'
      type: object
      required:
      - asteroid_id
      - current_observation
      - horizon_days
      title: CurrentForecastRequest
      example:
        asteroid_id: 433
        current_observation:
          dec: 25.248
          mjd_utc: 60900.5
          ra: 24.928
        horizon_days: 1.5
    CurrentForecastResult:
      properties:
        asteroid_id:
          type: integer
          title: Asteroid Id
        target:
          type: string
          title: Target
          description: Nombre según JPL Horizons
        method:
          type: string
          const: horizons
          title: Method
        observer:
          type: string
          title: Observer
          description: 500@-163182 = SPHEREx; 500@399 = geocentro (si no hay órbita
            de SPHEREx)
        current_observation:
          $ref: '#/components/schemas/AsteroidClick'
        predicted_ra_deg:
          type: number
          title: Predicted Ra Deg
        predicted_dec_deg:
          type: number
          title: Predicted Dec Deg
        sigma_arcsec:
          anyOf:
          - type: number
          - type: 'null'
          title: Sigma Arcsec
        forecast_mjd_utc:
          type: number
          title: Forecast Mjd Utc
        forecast_time:
          type: string
          title: Forecast Time
        horizon_days:
          type: number
          title: Horizon Days
