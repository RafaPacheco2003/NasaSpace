  /api/cube:
    get:
      tags:
      - L2 y cubo all-sky
      summary: Cubo all-sky de 102 canales para una coordenada (lento → 202 + trabajo)
      description: '**Para qué sirve:** el **sky cube** de SPHEREx (todo el cielo
        combinado, 102 canales 0.75–5 µm) en la tesela

        HEALPix que contiene la coordenada, como el pipeline. Devuelve los 102 canales
        (λ, bordes, ancho de banda) con la URL

        del PNG de cada uno, los **6 canales** del script (1, 20, 40, 60, 80, 102),
        el **espectro** de 102 puntos en la

        coordenada (brillo, FLAGS, NHITS) y las URLs de la figura de 6 canales, la
        vista 3D y el clic.


        La primera vez descarga la tesela completa (~320 MB, 30–90 s) → 202 + trabajo
        con progreso; después 200.

        El cubo no tiene fechas (es la combinación de todo el survey).


        **API externa:** IRSA (SIA spherex_dr1_cube + descarga de la tesela).'
      operationId: cube_prepare_api_cube_get
      parameters:
      - name: ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Ascensión recta en grados (ICRS/J2000).
          examples:
          - 133.795129
          title: Ra
        description: Ascensión recta en grados (ICRS/J2000).
      - name: dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Declinación en grados (ICRS/J2000).
          examples:
          - -7.245147
          title: Dec
        description: Declinación en grados (ICRS/J2000).
      - name: size
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 2048
            minimum: 64
          - type: 'null'
          description: Lado mayor del PNG (nativo 512). Usar el MISMO en /pixel.
          title: Size
        description: Lado mayor del PNG (nativo 512). Usar el MISMO en /pixel.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '202':
          description: Trabajo creado o en curso; consultar /api/jobs/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Falta un parámetro, coordenadas fuera de rango o límites excedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No se encontró el nombre, el frame o el trabajo (expirado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiadas peticiones desde la misma IP (cabecera Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Fallaron todas las fuentes pedidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
