  /api/l2/{frame_id}/pixel:
    get:
      tags:
      - L2 y cubo all-sky
      summary: 'Clic en el L2: RA/Dec + brillo de ese píxel'
      description: '**Para qué sirve:** al picar la imagen raw o color, mostrar **RA/Dec**
        de ese punto y su **brillo**:

        `brightness.value` (MJy/sr, IMAGE del L2), `zodi`, `value_minus_zodi`, `error`
        (√VARIANCE),

        `wavelength_um` de **ese** píxel (WCS-WAVE: el filtro de SPHEREx cambia a
        lo largo del detector) y `flags`.

        `x, y` en píxeles del PNG mostrado con el mismo `size`. También acepta `ra,
        dec`.'
      operationId: l2_pixel_api_l2__frame_id__pixel_get
      parameters:
      - name: frame_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^sx-d[1-6]-\d+$
          description: Id del frame L2 (de /api/l2, /api/frames o /api/sequence)
          title: Frame Id
        description: Id del frame L2 (de /api/l2, /api/frames o /api/sequence)
      - name: x
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Píxel del PNG desde el borde IZQUIERDO
          title: X
        description: Píxel del PNG desde el borde IZQUIERDO
      - name: y
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Píxel del PNG desde el borde SUPERIOR
          title: Y
        description: Píxel del PNG desde el borde SUPERIOR
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 2040
          minimum: 64
          description: Lado mayor del PNG en píxeles (nativo 2040). Usar el MISMO
            en /pixel.
          default: 1024
          title: Size
        description: Lado mayor del PNG en píxeles (nativo 2040). Usar el MISMO en
          /pixel.
      - name: ra
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
            exclusiveMaximum: 360
          - type: 'null'
          description: 'Alternativa: coordenada → píxel y valores'
          title: Ra
        description: 'Alternativa: coordenada → píxel y valores'
      - name: dec
        in: query
