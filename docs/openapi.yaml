openapi: 3.1.0
info:
  title: SpaceX Sky API
  description: '

    Backend del **SPHEREx Explorer**: comparador de parpadeo (blink) + espectrómetro
    para las imágenes de la

    misión SPHEREx de la NASA (102 bandas, 0.75–5 µm, todo el cielo cada 6 meses).


    El navegador solo llama a esta API. La API consulta estas **APIs externas** (públicas,
    sin clave):


    | API externa | Organización | Se usa en |

    |---|---|---|

    | **IRSA** SIA v2 + cutouts (SPHEREx DR1) + MOST | NASA/Caltech | frames, coverage,
    sequence, frame PNG, stack, spectrum, predict, asteroids |

    | **SIMBAD** (Sesame + TAP, espejo Harvard) | CDS Estrasburgo | resolve, objects,
    predict |

    | **NED** (ObjectLookup + TAP) | NASA/IPAC | resolve, objects |

    | **Gaia DR3** (TAP) | ESA | overlay (catalog=gaia), asteroids (confusión con
    estrellas) |

    | **AllWISE** (IRSA TAP / Gator) | NASA/IPAC | overlay (catalog=wise) |

    | **JPL Horizons** | NASA JPL | predict (asteroides y cometas), asteroids (observador
    SPHEREx) |


    **Reglas:** GET (salvo `POST /api/asteroids/predict-from-current`), sin autenticación,
    CORS abierto. Coordenadas en grados (ICRS/J2000); radio, fov y apertura

    en segundos de arco. Timeout 10 s por fuente externa con 1 reintento. Caché 24
    h (coordenadas redondeadas a 1″).

    Si falla solo una de las fuentes pedidas → 200 con `partial: true`.


    **Procesos lentos** (`sequence`, `stack`, `spectrum`, `predict`, `asteroids/predict-from-current`,
    `l2`, `cube`): 200 si el resultado está en caché; si no,

    **202 + Job** → consultar `GET /api/jobs/{id}` cada `poll_after_ms` hasta `done`
    o `failed`.


    **Errores:** siempre `{"error": {"code", "message"}}`.


    **Prueba rápida:** WISE 0855 → `ra=133.757901`, `dec=-7.242058` · Barnard → `ra=269.446227`,
    `dec=4.769463`.

    '
  version: 0.3.0
paths:
  /api/resolve:
    get:
      tags:
      - Catálogos
      summary: Resolver un nombre a coordenadas
      description: '**Para qué sirve:** el usuario escribe un nombre (`Barnard''s
        star`, `WISE 0855`, `RW Aur`…) y obtiene

        dónde está en el cielo.


        **API externa:** SIMBAD (vía Sesame de CDS); si no lo encuentra, NED (ObjectLookup).


        `ra/dec` son la posición de catálogo (época `epoch`). `current` es la posición
        propagada a la fecha `at`

        con movimiento propio + paralaje: **es la que se debe usar para centrar las
        imágenes**.'
      operationId: resolve_api_resolve_get
      parameters:
      - name: name
        in: query
        required: true
        schema:
          type: string
          maxLength: 200
          examples:
          - Barnard's star
          title: Name
      - name: at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Fecha a la que se propagan las posiciones con movimiento propio.
            Sin valor = hoy.
          title: At
        description: Fecha a la que se propagan las posiciones con movimiento propio.
          Sin valor = hoy.
      responses:
        '200':
          description: Resultado (en caché si es un proceso lento)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResult'
        '400':
          description: Falta un parámetro, coordenadas fuera de rango o límites excedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No se encontró el nombre, el frame o el trabajo (expirado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiadas peticiones desde la misma IP (cabecera Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Fallaron todas las fuentes pedidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Se agotó el tiempo en todas las fuentes pedidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/objects:
    get:
      tags:
      - Catálogos
      summary: Objetos de SIMBAD y NED en una región (búsqueda de cono)
      description: '**Para qué sirve:** marcar sobre la imagen qué puntos ya son conocidos:
        estrellas (SIMBAD) y galaxias o

        cuásares de fondo (NED). Lo que se mueve y no aparece aquí es candidato a
        descubrimiento.


        **APIs externas:** SIMBAD TAP (tabla `basic`, espejo de Harvard como reintento)
        y NED TAP (`NEDTAP.objdir`).

        Si falla solo una → 200 con `partial: true`.'
      operationId: objects_api_objects_get
      parameters:
      - name: ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Ascensión recta en grados (ICRS/J2000).
          examples:
          - 133.795129
          title: Ra
        description: Ascensión recta en grados (ICRS/J2000).
      - name: dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Declinación en grados (ICRS/J2000).
          examples:
          - -7.245147
          title: Dec
        description: Declinación en grados (ICRS/J2000).
      - name: radius
        in: query
        required: false
        schema:
          type: number
          maximum: 600
          exclusiveMinimum: 0
          description: Radio en segundos de arco.
          default: 60
          title: Radius
        description: Radio en segundos de arco.
      - name: catalogs
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: simbad, ned (por defecto ambos)
          title: Catalogs
        description: simbad, ned (por defecto ambos)
      - name: types
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
          - type: 'null'
          description: star, galaxy, other (por defecto todos)
          title: Types
        description: star, galaxy, other (por defecto todos)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 200
          title: Limit
      responses:
        '200':
          description: Resultado (en caché si es un proceso lento)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectsResult'
        '400':
          description: Falta un parámetro, coordenadas fuera de rango o límites excedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiadas peticiones desde la misma IP (cabecera Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Fallaron todas las fuentes pedidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Se agotó el tiempo en todas las fuentes pedidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/frames:
    get:
      tags:
      - Imágenes
      summary: Metadatos de los frames que cubren una región (rápido, sin imágenes)
      description: '**Para qué sirve:** saber qué imágenes de SPHEREx hay de ese punto
        (fechas, detector, longitud de onda)

        sin descargarlas. Sirve para la línea de tiempo y para elegir los ids de `/api/stack`.


        **API externa:** IRSA SIA v2 (`COLLECTION=spherex_dr1`).'
      operationId: frames_api_frames_get
      parameters:
      - name: ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Ascensión recta en grados (ICRS/J2000).
          examples:
          - 133.795129
          title: Ra
        description: Ascensión recta en grados (ICRS/J2000).
      - name: dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Declinación en grados (ICRS/J2000).
          examples:
          - -7.245147
          title: Dec
        description: Declinación en grados (ICRS/J2000).
      - name: fov
        in: query
        required: false
        schema:
          type: number
          maximum: 3600
          minimum: 10
          description: Campo de visión (lado del cuadro) en segundos de arco.
          default: 300
          title: Fov
        description: Campo de visión (lado del cuadro) en segundos de arco.
      - name: detector
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 6
            minimum: 1
          - type: 'null'
          description: 'Detector de SPHEREx. 1: 0.75–1.09 µm · 2: 1.10–1.62 · 3: 1.63–2.41
            · 4: 2.42–3.82 · 5: 3.83–4.41 · 6: 4.42–5.00. Sin valor = todos.'
          title: Detector
        description: 'Detector de SPHEREx. 1: 0.75–1.09 µm · 2: 1.10–1.62 · 3: 1.63–2.41
          · 4: 2.42–3.82 · 5: 3.83–4.41 · 6: 4.42–5.00. Sin valor = todos.'
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Resultado (en caché si es un proceso lento)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FramesResult'
        '400':
          description: Falta un parámetro, coordenadas fuera de rango o límites excedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiadas peticiones desde la misma IP (cabecera Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Fallaron todas las fuentes pedidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Se agotó el tiempo en todas las fuentes pedidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/sequence:
    get:
      tags:
      - Imágenes
      summary: Secuencia de imágenes de una región (lento → 202 + trabajo)
      description: '**Para qué sirve:** el "video" (blink comparator). Descarga, recorta
        y alinea píxel a píxel todas las

        imágenes de la región para reproducirlas en orden. Un objeto que se mueve
        "salta" entre frames.


        **API externa:** IRSA (búsqueda SIA + servicio de cutouts sobre los FITS de
        SPHEREx).


        Devuelve 200 si ya está en caché; si no, 202 + Job (consultar `/api/jobs/{id}`).'
      operationId: sequence_api_sequence_get
      parameters:
      - name: ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Ascensión recta en grados (ICRS/J2000).
          examples:
          - 133.795129
          title: Ra
        description: Ascensión recta en grados (ICRS/J2000).
      - name: dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Declinación en grados (ICRS/J2000).
          examples:
          - -7.245147
          title: Dec
        description: Declinación en grados (ICRS/J2000).
      - name: fov
        in: query
        required: false
        schema:
          type: number
          maximum: 3600
          minimum: 10
          description: Campo de visión (lado del cuadro) en segundos de arco.
          default: 300
          title: Fov
        description: Campo de visión (lado del cuadro) en segundos de arco.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1024
          minimum: 64
          description: Lado del PNG en píxeles (la imagen siempre es cuadrada).
          default: 512
          title: Size
        description: Lado del PNG en píxeles (la imagen siempre es cuadrada).
      - name: detector
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 6
            minimum: 1
          - type: 'null'
          description: 'Detector de SPHEREx. 1: 0.75–1.09 µm · 2: 1.10–1.62 · 3: 1.63–2.41
            · 4: 2.42–3.82 · 5: 3.83–4.41 · 6: 4.42–5.00. Sin valor = todos.'
          title: Detector
        description: 'Detector de SPHEREx. 1: 0.75–1.09 µm · 2: 1.10–1.62 · 3: 1.63–2.41
          · 4: 2.42–3.82 · 5: 3.83–4.41 · 6: 4.42–5.00. Sin valor = todos.'
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      - name: stretch
        in: query
        required: false
        schema:
          enum:
          - linear
          - log
          - sqrt
          - asinh
          type: string
          default: asinh
          title: Stretch
      - name: cmap
        in: query
        required: false
        schema:
          enum:
          - gray
          - viridis
          - magma
          - inferno
          type: string
          default: gray
          title: Cmap
      - name: scale
        in: query
        required: false
        schema:
          enum:
          - sequence
          - frame
          type: string
          description: 'sequence: mismos vmin/vmax en todos los frames; frame: cada
            uno por separado.'
          default: sequence
          title: Scale
        description: 'sequence: mismos vmin/vmax en todos los frames; frame: cada
          uno por separado.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 60
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Resultado (en caché si es un proceso lento)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SequenceResult'
        '202':
          description: Trabajo creado o en curso; consultar /api/jobs/{id}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Falta un parámetro, coordenadas fuera de rango o límites excedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiadas peticiones desde la misma IP (cabecera Retry-After)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/frame/{frame_id}.png:
    get:
      tags:
      - Imágenes
      summary: Render PNG del recorte de un frame
      description: '**Para qué sirve:** la imagen de un frame. Las `png_url` de `/api/sequence`
        apuntan aquí con toda la

        query: usarlas tal cual. Rápido si la secuencia ya preparó el recorte; si
        no, hasta ~10 s.


        **API externa:** IRSA (recorte FITS) si no está en caché.'
      operationId: frame_png_api_frame__frame_id__png_get
      parameters:
      - name: frame_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:+\-]{1,128}$
          title: Frame Id
      - name: ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Ascensión recta en grados (ICRS/J2000).
          examples:
          - 133.795129
          title: Ra
        description: Ascensión recta en grados (ICRS/J2000).
      - name: dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Declinación en grados (ICRS/J2000).
          examples:
          - -7.245147
          title: Dec
        description: Declinación en grados (ICRS/J2000).
      - name: fov
        in: query
        required: false
        schema:
          type: number
          maximum: 3600
          minimum: 10
          description: Campo de visión (lado del cuadro) en segundos de arco.
          default: 300
          title: Fov
        description: Campo de visión (lado del cuadro) en segundos de arco.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1024
          minimum: 64
          description: Lado del PNG en píxeles (la imagen siempre es cuadrada).
          default: 512
          title: Size
        description: Lado del PNG en píxeles (la imagen siempre es cuadrada).
      - name: stretch
        in: query
        required: false
        schema:
          enum:
          - linear
          - log
          - sqrt
          - asinh
          type: string
          default: asinh
          title: Stretch
      - name: cmap
        in: query
        required: false
        schema:
          enum:
          - gray
          - viridis
          - magma
          - inferno
          type: string
          default: gray
          title: Cmap
      - name: vmin
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Límite inferior (MJy/sr). Sin valor = automático.
          title: Vmin
        description: Límite inferior (MJy/sr). Sin valor = automático.
      - name: vmax
        in: query
        required: false
        schema:
          anyOf:
          - type: number
          - type: 'null'
          description: Límite superior (MJy/sr). Sin valor = automático.
          title: Vmax
        description: Límite superior (MJy/sr). Sin valor = automático.
      responses:
        '200':
          description: Imagen PNG (TAN, norte arriba, este a la izquierda)
          content:
            image/png: {}
        '400':
          description: Falta un parámetro, coordenadas fuera de rango o límites excedidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No se encontró el nombre, el frame o el trabajo (expirado)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Fallaron todas las fuentes pedidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: Se agotó el tiempo en todas las fuentes pedidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
