          type: string
          title: Type Raw
          description: Tipo original del catálogo (otype de SIMBAD / prefphytype de
            NED)
        z:
          anyOf:
          - type: number
          - type: 'null'
          title: Z
          description: Corrimiento al rojo
        distance_arcsec:
          type: number
          title: Distance Arcsec
          description: Distancia al centro de la búsqueda (″)
        pm:
          anyOf:
          - $ref: '#/components/schemas/ProperMotion'
          - type: 'null'
      type: object
      required:
      - id
      - name
      - source
      - ra
      - dec
      - type
      - type_raw
      - distance_arcsec
      title: SkyObject
    SourceStatus:
      properties:
        ok:
          type: boolean
          title: Ok
        latency_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Latency Ms
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
      type: object
      required:
      - ok
      title: SourceStatus
    SpectrumPoint:
      properties:
        wavelength:
          type: number
          title: Wavelength
          description: µm (exacta, del WCS-WAVE del FITS)
        flux:
          type: number
          title: Flux
          description: µJy (fotometría de apertura menos fondo)
        error:
          type: number
          title: Error
          description: µJy
        date_obs:
          type: string
          title: Date Obs
          description: Fecha de la exposición → ordenando por fecha es una curva de
            luz
        detector:
          type: integer
          title: Detector
        frame_id:
          type: string
          title: Frame Id
        flags:
          items:
            type: string
          type: array
          title: Flags
        wavelength_exact:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Wavelength Exact
      type: object
      required:
      - wavelength
      - flux
      - error
      - date_obs
      - detector
      - frame_id
      - flags
      title: SpectrumPoint
    SpectrumResult:
      properties:
        partial:
          type: boolean
          title: Partial
          description: true si falló alguna de las fuentes pedidas (el resto sí respondió)
          default: false
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          description: Motivo de cada fallo parcial
        cache:
          type: string
          enum:
          - hit
          - miss
          title: Cache
          description: hit = servido desde la caché de 24 h
          default: miss
        center:
          $ref: '#/components/schemas/Center'
        aperture_arcsec:
          type: number
          title: Aperture Arcsec
        wavelength_unit:
          type: string
          title: Wavelength Unit
          default: um
        flux_unit:
          type: string
          title: Flux Unit
          default: uJy
        points:
          items:
            $ref: '#/components/schemas/SpectrumPoint'
          type: array
          title: Points
          description: Ordenados por longitud de onda
        n_exposures:
          anyOf:
          - type: integer
          - type: 'null'
          title: N Exposures
      type: object
      required:
      - center
      - aperture_arcsec
      - points
      title: SpectrumResult
      description: 'Espectro 0.75–5 µm. Fuente externa: IRSA (una exposición de SPHEREx
        = un punto).'
      example:
        aperture_arcsec: 12.0
        cache: miss
        center:
          dec: 4.770556
          ra: 269.446111
        flux_unit: uJy
        n_exposures: 239
        partial: true
        points:
        - date_obs: '2026-03-11T02:11:37.219Z'
          detector: 1
          error: 5960.26
          flags:
          - bloom
          - cosmic_ray
          - saturation
          flux: 1440043.44
          frame_id: sx-d1-1773195097219
          wavelength: 0.7431
          wavelength_exact: true
        warnings:
        - 'sx-d6-1756083361046: spherex: HTTP 503'
        wavelength_unit: um
    StackResult:
      properties:
        op:
          type: string
          enum:
          - mean
          - median
          - sum
          - diff
          title: Op
        n_frames:
          type: integer
          title: N Frames
        center:
          $ref: '#/components/schemas/Center'
        fov_arcsec:
          type: number
          title: Fov Arcsec
        size_px:
          type: integer
          title: Size Px
        vmin:
          type: number
          title: Vmin
        vmax:
          type: number
          title: Vmax
          description: 'En diff la escala es simétrica: vmin = −vmax'
        unit:
          type: string
          title: Unit
          default: MJy/sr
        png_url:
          type: string
          title: Png Url
        partial:
          type: boolean
          title: Partial
          default: false
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          default: []
      type: object
      required:
      - op
      - n_frames
      - center
      - fov_arcsec
      - size_px
      - vmin
      - vmax
      - png_url
      title: StackResult
      description: 'Apilado o resta de épocas. Fuente externa: IRSA (recortes FITS
        de SPHEREx).'
      example:
        center:
          dec: 4.770556
          ra: 269.446111
        fov_arcsec: 120.0
        n_frames: 6
        op: diff
        partial: false
        png_url: /api/stack/stk_cc6f162d39c8.png
        size_px: 256
        unit: MJy/sr
        vmax: 3.2164
        vmin: -3.2164
        warnings: []
    StatusResult:
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          title: Status
        version:
          type: string
          title: Version
        data_release:
          type: string
          title: Data Release
        spherex_mode:
          anyOf:
          - type: string
          - type: 'null'
          title: Spherex Mode
        sources:
          additionalProperties:
            $ref: '#/components/schemas/SourceStatus'
          type: object
          title: Sources
          description: spherex, simbad, ned, gaia, wise, horizons
        jobs:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Jobs
          description: 'Cola de trabajos: running, queued, paused_now, paused_total'
      type: object
      required:
      - status
      - version
      - data_release
      - sources
      title: StatusResult
      description: Estado de la API y de cada fuente externa.
      example:
        data_release: SPHEREx DR1 (IRSA, colección spherex_dr1)
        sources:
          simbad:
            latency_ms: 535
            ok: true
          spherex:
            latency_ms: 383
            ok: true
        spherex_mode: irsa
        status: ok
        version: 0.3.0
    TrackPoint:
      properties:
        mjd_utc:
          type: number
          title: Mjd Utc
        time:
          type: string
          title: Time
        ra:
          type: number
          title: Ra
        dec:
          type: number
          title: Dec
        sigma_arcsec:
          anyOf:
          - type: number
          - type: 'null'
          title: Sigma Arcsec
          description: Incertidumbre 3σ de Horizons (RA/Dec), si la da
        pixel:
          anyOf:
          - $ref: '#/components/schemas/PixelResult'
          - type: 'null'
          description: Solo si se mandó view
      type: object
      required:
      - mjd_utc
      - time
      - ra
      - dec
      title: TrackPoint
    View:
      properties:
        ra:
          type: number
          exclusiveMaximum: 360.0
          minimum: 0.0
          title: Ra
        dec:
          type: number
          maximum: 90.0
          minimum: -90.0
          title: Dec
        fov:
          type: number
          maximum: 3600.0
          minimum: 10.0
          title: Fov
          description: Segundos de arco
        size:
          type: integer
          maximum: 1024.0
          minimum: 64.0
          title: Size
          description: Píxeles
      type: object
      required:
      - ra
      - dec
      - fov
      - size
      title: View
      description: 'Geometría del PNG que muestra el Frontend: los mismos ra, dec,
        fov, size de /api/sequence o png_url.'
tags:
