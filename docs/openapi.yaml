  /api/stack:
    get:
      tags:
      - Imágenes
      summary: Apilar o restar frames (lento → 202 + trabajo)
      description: '**Para qué sirve:** `mean/median/sum` suman imágenes para ver
        objetos débiles (más señal/ruido).

        `diff` = media(a) − media(b): resta dos épocas; las estrellas fijas se anulan
        y lo que se movió o cambió

        de brillo aparece en ámbar (positivo) y cian (negativo).


        **API externa:** IRSA (recortes FITS de SPHEREx). Máximo 100 ids por lista.'
      operationId: stack_api_stack_get
      parameters:
      - name: ra
        in: query
        required: true
        schema:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: Ascensión recta en grados (ICRS/J2000).
          examples:
          - 133.795129
          title: Ra
        description: Ascensión recta en grados (ICRS/J2000).
      - name: dec
        in: query
        required: true
        schema:
          type: number
          maximum: 90
          minimum: -90
          description: Declinación en grados (ICRS/J2000).
          examples:
          - -7.245147
          title: Dec
        description: Declinación en grados (ICRS/J2000).
      - name: fov
        in: query
        required: false
        schema:
          type: number
          maximum: 3600
          minimum: 10
          description: Campo de visión (lado del cuadro) en segundos de arco.
          default: 300
          title: Fov
        description: Campo de visión (lado del cuadro) en segundos de arco.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1024
          minimum: 64
          description: Lado del PNG en píxeles (la imagen siempre es cuadrada).
          default: 512
          title: Size
        description: Lado del PNG en píxeles (la imagen siempre es cuadrada).
