        \ de\n   60″ de la efeméride → `422 identity_mismatch`.\n2. **Predicción:**\
        \ posición en T3 + `horizon_days` (0 < h ≤ 30).\n3. **Trayectoria:** 9 posiciones\
        \ de T3 a la predicción (`track`) para dibujar la línea.\n4. **Píxeles:**\
        \ con `view` (= ra, dec, fov, size del PNG mostrado) cada posición trae `pixel.x`\
        \ / `pixel.y_top`\n   desde la esquina superior izquierda e `inside_image`.\n\
        \nResponde 200 directo (~1–2 s la primera vez, instantáneo después; con caché).\n\
        \n**API externa:** JPL Horizons (e IRSA solo si se manda `image_id` que no\
        \ está en caché)."
      operationId: predict_from_current_api_asteroids_predict_from_current_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurrentForecastRequest'
        required: true
      responses:
